server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The artist platform API doesn't send CORS headers for this deployment's
    # origin, so proxy it same-origin instead of calling it directly from
    # the browser.
    location /api/ {
        proxy_pass https://artistplatformdocs.polarbearsandboxproduction.com/api/;
        proxy_set_header Host artistplatformdocs.polarbearsandboxproduction.com;
        proxy_ssl_server_name on;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
